[package]
name = "paintrs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
bytemuck = "1.25.2"
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "gif", "webp", "ico"] }
log = "0.4.34"
rfd = "0.17"
rhai = "1.26"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36", features = ["persistence"] }
arboard = "3.6.1"
env_logger = "0.11.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL via glow on the web: smaller download and works everywhere WebGL2 does.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence", "web_screen_reader"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3.105"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = ["BeforeUnloadEvent", "Window", "Document", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlCanvasElement", "Element", "ClipboardEvent", "DataTransfer", "DataTransferItemList", "DataTransferItem", "File", "Navigator", "Clipboard", "ClipboardItem"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Keep image decoding and compositing fast in debug builds.
[profile.dev.package."*"]
opt-level = 2
